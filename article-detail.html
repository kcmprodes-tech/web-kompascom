<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kompas.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <script type="module" src="/src/js/article-detail.js"></script>
  </head>
  <body class="home-body art-body">
    <header class="hm-header">
      <div class="hm-bar">
        <a class="hm-brand" href="./index.html" aria-label="Kompas.com">
          <img class="hm-logo" src="/assets/home/logo-kompas.svg" alt="Kompas.com" />
        </a>
        <div class="hm-actions">
          <button class="hm-act" type="button" aria-label="Belanja">
            <img src="/assets/home/icons/handbag.svg" alt="" aria-hidden="true" />
          </button>
          <a class="hm-act hm-act--kplus" href="./membership.html" aria-label="Kompas+">
            <img src="/assets/home/icons/kplus.svg" alt="" aria-hidden="true" />
          </a>
          <button class="hm-act" type="button" aria-label="Cari">
            <img src="/assets/home/icons/search.svg" alt="" aria-hidden="true" />
          </button>
          <a class="hm-act hm-act--user" href="./account.html" aria-label="Akun">
            <span class="hm-user-ring"><img src="/assets/home/icons/user.svg" alt="" aria-hidden="true" /></span>
          </a>
        </div>
      </div>

      <nav class="hm-nav" aria-label="Kanal">
        <a href="#" class="is-active">Terpopuler</a>
        <a href="#">News</a>
        <a href="#">Nusaraya</a>
        <a href="#">Jagat Literasi</a>
        <a href="#">Cahaya</a>
        <a href="#">Tekno</a>
        <a href="#">Otomotif</a>
        <a href="#">Bola</a>
        <a href="#">Lifestyle</a>
        <a href="#">Tren</a>
        <a href="#">Lestari</a>
        <a href="#">Health</a>
        <a href="#">Money</a>
        <a href="#">Properti</a>
        <a href="#">Sains</a>
        <a href="#">Edukasi</a>
        <a href="#">Travel</a>
        <a href="#">Parapuan</a>
        <a href="#">Kolom</a>
        <a href="#">JEO</a>
        <a href="#">Video</a>
        <a href="#">Foto</a>
        <a href="#">Buku</a>
        <a href="#">VIK</a>
      </nav>
    </header>

    <!-- Read - Mobile (Figma 664:18534) -->
    <main class="hm-main">
      <aside class="hm-topad" aria-label="Iklan">
        <img src="/assets/ad-hit-cashback.png" alt="Iklan" />
      </aside>

      <article class="art" data-art>
        <header class="art-head">
          <nav class="art-crumb" aria-label="Breadcrumb" data-art-crumb>
            <a href="./index.html">Home</a>
          </nav>
          <h1 class="art-title" data-art-title></h1>
          <div class="art-meta">
            <div class="art-meta__src">
              <strong>Kompas.com</strong>
              <time data-art-date></time>
            </div>
            <a class="art-app" href="#">
              <img class="art-app__logo" src="/assets/article/icon-kompas.png" alt="" aria-hidden="true" />
              <span>Baca di App</span>
              <img class="art-app__ext" src="/assets/article/external.svg" alt="" aria-hidden="true" />
            </a>
          </div>
          <div class="art-team">
            <span class="art-team__avatars" data-art-avatars></span>
            <span class="art-team__text">
              <strong data-art-editors></strong>
              <span>Tim Redaksi</span>
            </span>
          </div>
        </header>

        <div class="art-actions">
          <button class="art-pill" type="button" aria-pressed="false" data-like>
            <img src="/assets/article/thumbs.svg" alt="" aria-hidden="true" /><span data-like-count>2,2 rb</span>
          </button>
          <button class="art-round" type="button" aria-label="Bagikan" data-share>
            <img src="/assets/article/share.svg" alt="" aria-hidden="true" />
          </button>
          <button class="art-round" type="button" aria-label="Simpan" aria-pressed="false" data-save>
            <img src="/assets/article/bookmark.svg" alt="" aria-hidden="true" />
          </button>
          <button class="art-round art-round--gift" type="button" aria-label="Apresiasi spesial">
            <img src="/assets/article/apresiasi.jpg" alt="" aria-hidden="true" />
          </button>
          <a class="art-pill" href="#komentar">
            <img src="/assets/article/chat.svg" alt="" aria-hidden="true" /><span>2,2 rb</span>
          </a>
        </div>

        <figure class="art-photo">
          <div class="art-photo__main">
            <img data-art-photo alt="" />
            <button class="art-photo__see" type="button" data-see-photo>
              <img src="/assets/article/eye.svg" alt="" aria-hidden="true" />Lihat Foto
            </button>
          </div>
          <div class="art-photo__thumbs" data-art-thumbs hidden></div>
          <figcaption class="art-photo__cap" data-art-caption hidden></figcaption>
        </figure>

        <div class="art-body" data-art-body></div>
      </article>
    </main>
  </body>
</html>
